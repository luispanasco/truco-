<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ícono de la app: el 2, el 4 y el 5 de oro (piezas) en abanico, con un sol de rayos detrás, sobre
    el paño con marco de madera. Es la fuente de los PNG (scripts/iconos.mjs); el favicon es
    favicon.svg, una versión simplificada. Los colores son los de estilos.css.
    Las cartas quedan dentro del círculo seguro de los íconos "maskable" (radio 40 %), así el
    mismo dibujo sirve con el paño a sangre (sin #madera y con #pano ocupando todo); los rayos
    pueden quedar recortados.
  -->
  <defs>
    <radialGradient id="degrade-pano" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a8048" />
      <stop offset="0.6" stop-color="#1f6b3a" />
      <stop offset="1" stop-color="#154d29" />
    </radialGradient>
    <linearGradient id="degrade-madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a36" />
      <stop offset="1" stop-color="#6b4226" />
    </linearGradient>
    <radialGradient id="degrade-sol" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4" />
      <stop offset="0.35" stop-color="#f2c14e" />
      <stop offset="1" stop-color="#d4902a" />
    </radialGradient>
    <linearGradient id="degrade-moneda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd86b" />
      <stop offset="0.55" stop-color="#e0a82e" />
      <stop offset="1" stop-color="#b47d14" />
    </linearGradient>
    <filter id="sombra" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.4" />
    </filter>

    <g id="moneda">
      <circle r="28" fill="url(#degrade-moneda)" stroke="#8a5f0a" stroke-width="3.5" />
      <circle r="17.5" fill="none" stroke="#8a5f0a" stroke-width="2.5" />
      <circle r="5.6" fill="#8a5f0a" />
    </g>
    <!-- Carta de oro (lienzo de 200 × 300, como las cartas de la app): el marco de oro no tiene cortes. -->
    <g id="carta-oro">
      <rect x="1.5" y="1.5" width="197" height="297" rx="16" fill="#fbf6ea" stroke="#b9ab8c" stroke-width="3" />
      <rect x="14" y="14" width="172" height="272" rx="2" fill="none" stroke="#b8860b" stroke-width="3" />
    </g>
  </defs>

  <rect id="madera" width="512" height="512" rx="104" fill="url(#degrade-madera)" />
  <rect id="pano" x="26" y="26" width="460" height="460" rx="82" fill="url(#degrade-pano)" />

  <!-- El sol: 24 rayos, largos y cortos alternados. -->
  <g transform="translate(256 224) scale(0.92)">
    <path fill="url(#degrade-sol)" d="M61.8,-5.4L205.0,0.0L61.8,5.4ZM61.1,10.8L144.9,38.8L58.3,21.2ZM56.2,26.2L177.5,102.5L50.8,35.6ZM47.5,39.9L106.1,106.1L39.9,47.5ZM35.6,50.8L102.5,177.5L26.2,56.2ZM21.2,58.3L38.8,144.9L10.8,61.1ZM5.4,61.8L0.0,205.0L-5.4,61.8ZM-10.8,61.1L-38.8,144.9L-21.2,58.3ZM-26.2,56.2L-102.5,177.5L-35.6,50.8ZM-39.9,47.5L-106.1,106.1L-47.5,39.9ZM-50.8,35.6L-177.5,102.5L-56.2,26.2ZM-58.3,21.2L-144.9,38.8L-61.1,10.8ZM-61.8,5.4L-205.0,0.0L-61.8,-5.4ZM-61.1,-10.8L-144.9,-38.8L-58.3,-21.2ZM-56.2,-26.2L-177.5,-102.5L-50.8,-35.6ZM-47.5,-39.9L-106.1,-106.1L-39.9,-47.5ZM-35.6,-50.8L-102.5,-177.5L-26.2,-56.2ZM-21.2,-58.3L-38.8,-144.9L-10.8,-61.1ZM-5.4,-61.8L-0.0,-205.0L5.4,-61.8ZM10.8,-61.1L38.8,-144.9L21.2,-58.3ZM26.2,-56.2L102.5,-177.5L35.6,-50.8ZM39.9,-47.5L106.1,-106.1L47.5,-39.9ZM50.8,-35.6L177.5,-102.5L56.2,-26.2ZM58.3,-21.2L144.9,-38.8L61.1,-10.8Z" />
    <circle r="66" fill="url(#degrade-sol)" stroke="#c9871f" stroke-width="3" />
  </g>

  <!-- El abanico, como en la mano: cada carta arriba de la anterior, con el número a la vista. -->
  <g id="cartas" transform="translate(256 352) scale(0.68)" font-family="Georgia, serif" font-weight="bold" font-size="30" fill="#b8860b" text-anchor="middle">
    <g transform="translate(-38 0) rotate(-22) translate(-100 -290)" filter="url(#sombra)">
      <use href="#carta-oro" />
      <use href="#moneda" x="100" y="95" /><use href="#moneda" x="100" y="205" />
      <text x="31" y="50">2</text>
    </g>
    <g transform="translate(-100 -295)" filter="url(#sombra)">
      <use href="#carta-oro" />
      <use href="#moneda" x="65" y="95" /><use href="#moneda" x="135" y="95" />
      <use href="#moneda" x="65" y="205" /><use href="#moneda" x="135" y="205" />
      <text x="31" y="50">4</text>
    </g>
    <g transform="translate(38 0) rotate(22) translate(-100 -290)" filter="url(#sombra)">
      <use href="#carta-oro" />
      <use href="#moneda" x="65" y="95" /><use href="#moneda" x="135" y="95" />
      <use href="#moneda" x="100" y="150" />
      <use href="#moneda" x="65" y="205" /><use href="#moneda" x="135" y="205" />
      <text x="31" y="50">5</text>
    </g>
  </g>
</svg>
