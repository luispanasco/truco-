<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ícono de la app: un dorso y el ancho de espadas en abanico sobre el paño, con marco de madera.
    Es la fuente de los PNG (scripts/iconos.mjs) y el favicon. Los colores son los de estilos.css.
    Las cartas quedan dentro del círculo seguro de los íconos "maskable" (radio 40 %), así el
    mismo dibujo sirve con el paño a sangre (sin #madera y con #pano ocupando todo).
  -->
  <defs>
    <radialGradient id="degrade-pano" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2a8048" />
      <stop offset="0.6" stop-color="#1f6b3a" />
      <stop offset="1" stop-color="#154d29" />
    </radialGradient>
    <linearGradient id="degrade-madera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a36" />
      <stop offset="1" stop-color="#6b4226" />
    </linearGradient>
    <pattern id="trama-dorso" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#8b1e1e" />
      <path d="M0,8 H16 M8,0 V16" stroke="#d9b36c" stroke-width="2" />
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect id="madera" width="512" height="512" rx="104" fill="url(#degrade-madera)" />
  <rect id="pano" x="26" y="26" width="460" height="460" rx="82" fill="url(#degrade-pano)" />

  <g id="cartas">
    <!-- Dorso, atrás y a la izquierda (lienzo de 200 × 300, como las cartas de la app). -->
    <g transform="translate(206 262) rotate(-13) scale(0.76) translate(-100 -150)" filter="url(#sombra)">
      <rect x="1.5" y="1.5" width="197" height="297" rx="16" fill="#8b1e1e" stroke="#d9b36c" stroke-width="3" />
      <rect x="16" y="16" width="168" height="268" rx="10" fill="url(#trama-dorso)" stroke="#d9b36c" stroke-width="3" />
      <circle cx="100" cy="150" r="34" fill="#8b1e1e" stroke="#d9b36c" stroke-width="4" />
      <path d="M100,124 L108,144 L128,150 L108,156 L100,176 L92,156 L72,150 L92,144 Z" fill="#d9b36c" />
    </g>

    <!-- Ancho de espadas, adelante y a la derecha. -->
    <g transform="translate(300 266) rotate(11) scale(0.76) translate(-100 -150)" filter="url(#sombra)">
      <rect x="1.5" y="1.5" width="197" height="297" rx="16" fill="#fbf6ea" stroke="#b9ab8c" stroke-width="3" />
      <!-- Marco con dos cortes arriba y abajo: la pinta de espadas. -->
      <g stroke="#1f4e8c" stroke-width="3" stroke-linecap="round">
        <line x1="14" y1="14" x2="14" y2="286" />
        <line x1="186" y1="14" x2="186" y2="286" />
        <path d="M14,14 H64.3 M78.3,14 H121.7 M135.7,14 H186" />
        <path d="M14,286 H64.3 M78.3,286 H121.7 M135.7,286 H186" />
      </g>
      <!-- La espada, grande (el símbolo de la app, de 100 × 100, escalado). -->
      <g transform="translate(100 156) scale(2.3)" stroke-linejoin="round">
        <path d="M0,-52 L8,-38 L8,16 L-8,16 L-8,-38 Z" fill="#dfe7f0" stroke="#3c4a5c" stroke-width="3" />
        <path d="M0,-40 V12" stroke="#9fb0c4" stroke-width="2.5" />
        <rect x="-26" y="15" width="52" height="9" rx="4" fill="#e0a82e" stroke="#8a5f0a" stroke-width="3" />
        <rect x="-6" y="24" width="12" height="17" fill="#1f4e8c" stroke="#10294a" stroke-width="3" />
        <circle cy="46" r="7" fill="#e0a82e" stroke="#8a5f0a" stroke-width="3" />
      </g>
    </g>
  </g>
</svg>
